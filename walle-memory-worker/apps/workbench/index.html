</style></head><body><div class="shell"><aside id="sidebar" class="sidebar"><div class="brand"><span class="brand-icon">w</span><span class="brand-label">Walle Memory</span></div><div class="workspace"><div class="workspace-label">WORKSPACE</div><select id="workspace" aria-label="当前 workspace"><option>正在连接…</option></select><p id="workspace-type" class="small muted"></p></div><div><div class="nav-label">我的记忆</div><nav id="categories" aria-label="记忆类型"></nav></div><div class="side-note"><b>记住，也能找到。</b><p style="margin-top:8px">记录待办、决策和偏好，<br>在不同对话间接着往下做。</p></div></aside><main class="main"><header class="top"><div><div class="title-row"><button id="sidebar-toggle" class="sidebar-toggle" aria-label="收起侧栏" aria-controls="sidebar" aria-expanded="true" title="收起侧栏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16m7-12-3 4 3 4"/></svg></button><h1>Walle Memory</h1></div><p id="subtitle">查看记忆条目与最近更新</p></div><div class="actions"><button id="expand" aria-label="展开 Walle Memory" hidden>⤢</button><button id="refresh" class="refresh">↻ 刷新</button></div></header><div id="error" class="error" role="alert" hidden></div><section class="overview" aria-label="记忆概览"><span class="stat">条目 <b id="total">—</b></span><span class="stat" title="已加载条目的摘要状态">已完成 <b id="done">—</b></span><span class="stat" title="已加载条目中的待办、进行中、待验证和待反馈">待跟进 <b id="pending">—</b></span><span class="stat" title="已加载条目，北京时间">今天更新 <b id="today">—</b></span><span class="stats-scope">后 3 项统计已加载条目</span></section><div class="content"><section class="list-panel"><div class="toolbar"><div class="tabs" role="tablist"><button id="entries-tab" role="tab" aria-selected="true">记忆条目</button><button id="changes-tab" role="tab" aria-selected="false">更新动态</button></div><span id="visible-count" class="muted small"></span></div><div id="controls" class="controls"><input id="search" class="search" type="search" placeholder="搜索 key 或摘要…" aria-label="搜索 key 或摘要"><select id="status-filter" class="status-filter" aria-label="筛选状态"><option value="all">全部状态</option><option value="completed">已完成</option><option value="pending">待办</option><option value="in_progress">进行中</option><option value="needs_validation">待验证</option><option value="awaiting_feedback">待反馈</option><option value="scheduled">日程</option><option value="unknown">未标明</option></select></div><div id="entries"><p class="empty">正在连接 MCP Apps…</p></div><div id="changes" hidden></div><div id="history-note" class="history-note" hidden></div><div id="list-footer" class="list-footer"><span id="page-info">状态来自摘要；需要时查看正文确认</span><button id="more" hidden>加载更多</button></div></section><aside id="detail-panel" class="detail-panel"><div class="detail-head"><span id="detail-heading">条目详情</span><div class="detail-actions"><button id="edit-entry" hidden>编辑</button><button id="close-detail" class="close-detail" aria-label="关闭详情">×</button></div></div><div id="detail" class="detail-body"><div class="empty"><span class="empty-symbol">◫</span>选择一条记忆<br><span class="small">查看正文、状态与更新时间</span></div></div><div class="detail-note">编辑后保存到当前空间，保留原 key 和到期时间。</div></aside></div><footer class="bottom"><span><span class="live-dot"></span><span id="sync-time">等待连接</span> <span class="preview-label preview">· 本地设计预览</span></span><label class="auto"><input id="auto-refresh" type="checkbox" checked>自动刷新 · 45 秒</label></footer><p class="status-help">状态标签根据摘要识别，仅供浏览；部分完成与后续待办请以正文为准。</p></main></div><dialog id="discard-dialog"><div><h2>放弃未保存的修改？</h2><p>继续编辑可以保留当前草稿。</p><div class="edit-actions"><button id="discard-keep" type="button">继续编辑</button><button id="discard-confirm" type="button">放弃修改</button></div></div></dialog><script type="module">/*__APP_SCRIPT__*/</script></body></html>
